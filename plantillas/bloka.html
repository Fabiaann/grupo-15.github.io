<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../estilos/bloka.css">
</head>

<body>
 
<div class="contenedor">
    <div class="banco-imagenes oculto">
        <div class="gancho">
            <img src="../svg/hand-agarre.svg">
        </div>
    </div>
    
    
    <div class="juego oculto">
        <div class="header-juego">
            <div class="ajuste-juego"><button class="sonidoOff">off</button>
            <button class="sonidoOn oculto">onn</button></div>
            <div class="time">
                <p class="mostrarTiempo">00:00:00</p>
            </div>
            <div class="mostrarNivel">             </div>
            <div class="pista-juego">
                <button id="pista">Pista</button>
            </div>
        </div>
        
        <div class="juego11">
            <button id="comenzar" class="comenzar">comenzar</button>      
        </div>
        <button class="siguienteNivel oculto">siguienteNivel</button>
    </div>

    <div class="mostrarBotones">
        
        <div>   <p>Selecciona la cantidad de subImagenes, para comenzar el juego</p></div>
        <button id="btn4">4</button>
        <button id="btn6">6</button>
        <button id="btn8">8</button>
    </div>
    
    <canvas id="canvas" width="500px" height="500px" style="border: solid 1px red; " class="oculto"></canvas>

    <div class="ganoElJuegoCompleto oculto"> 
        <p>Felicidades pasastes todos los niveles</p>
        <button onclick="location.reload()">volver al inicio</button>
    </div>
</div>

    <script src="../js/bloka.js" defer></script>
</body>

</html>
