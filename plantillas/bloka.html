<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocka Game</title>
    <link rel="stylesheet" href="../estilos/bloka.css?v=20261013-11">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
 
<div class="contenedor en-menu">
    <div class="juego oculto">
        <div class="header-juego">
            <div class="hud-moneda" aria-label="Vidas: 9">
                <i class="fa-solid fa-heart" aria-hidden="true"></i><strong id="vidasUsuario">9</strong>
            </div>
            <div class="hud-centro">
                <div class="hud-estrellas" aria-label="Tres estrellas">★ <span>★</span> ★</div>
                <div class="time"><span>Tiempo</span><p class="mostrarTiempo">00:00:00</p></div>
                <div class="mostrarNivel"></div>
            </div>
            <div class="hud-acciones">
                <button class="hud-home" id="volverMenu" type="button" aria-label="Volver al menú del juego">
                    <i class="fa-solid fa-house" aria-hidden="true"></i>
                </button>
                <button class="hud-ayuda" id="pista" type="button" aria-label="Usar pista" title="Ayuda disponible: 5">
                    <i class="fa-regular fa-lightbulb" aria-hidden="true"></i><span class="hud-ayuda__contador" id="contadorAyudas">5</span>
                </button>
            </div>
        </div>
        
        <div class="juego11">
            <button id="comenzar" class="comenzar">Comenzar</button>
        </div>
    </div>

    <div class="menu-principal">
        <header class="menu-hud">
            <div class="menu-hud__estadisticas">
                <div class="menu-stat menu-stat--monedas" aria-label="Monedas: 0">
                    <i class="fa-solid fa-coins" aria-hidden="true"></i><strong id="monedasMenu">0</strong>
                </div>
                <div class="menu-stat menu-stat--vidas" aria-label="Vidas">
                    <i class="fa-solid fa-heart" aria-hidden="true"></i><strong id="vidasMenu">9</strong>
                    <span class="menu-stat__reloj" id="relojVidas" aria-live="off">05:00</span>
                </div>
                <div class="menu-stat menu-stat--estrellas" aria-label="Estrellas ganadas">
                    <i class="fa-solid fa-star" aria-hidden="true"></i><strong id="estrellasMenu">0</strong>
                </div>
            </div>
            <button class="menu-ajustes" id="abrirAjustes" type="button" aria-label="Ajustes">
                <i class="fa-solid fa-gear" aria-hidden="true"></i>
            </button>
        </header>
        <div class="banco-imagenes oculto" aria-label="Sorteo de imagen">
            <div class="gancho" aria-hidden="true">
                <svg viewBox="0 0 48 48" focusable="false"><path d="M24 4v30m0 0L11 21m13 13 13-13"/></svg>
            </div>
            <div class="pista-imagenes"></div>
        </div>
        <div class="mostrarBotones">
            <button id="iniciarPartida" class="iniciar-partida" type="button" disabled>Jugar</button>
        </div>
    </div>
    <canvas id="canvas" width="500px" height="500px" style="border: solid 1px red; " class="oculto"></canvas>

    <div class="modal-nivel oculto" id="modalNivel" role="dialog" aria-modal="true" aria-labelledby="tituloNivelCompletado">
        <div class="modal-nivel__tarjeta">
            <button class="modal-nivel__cerrar" id="cerrarNivel" type="button" aria-label="Volver al menú">&times;</button>
            <div class="modal-nivel__estrellas" aria-label="Tres estrellas">
                <span>&#9733;</span><span>&#9733;</span><span>&#9733;</span>
            </div>
            <h2 id="tituloNivelCompletado">&#161;Nivel completado!</h2>
            <p class="modal-nivel__descripcion" id="descripcionNivel">Imagen completada.</p>
            <button class="modal-nivel__siguiente" id="siguienteNivel" type="button">Siguiente nivel</button>
        </div>
    </div>

    <div class="modal-construccion oculto" id="modalAjustes" role="dialog" aria-modal="true" aria-labelledby="tituloConstruccion">
        <div class="modal-construccion__tarjeta">
            <button class="modal-construccion__cerrar" id="cerrarAjustes" type="button" aria-label="Cerrar">&times;</button>
            <i class="fa-solid fa-person-dig modal-construccion__icono" aria-hidden="true"></i>
            <h2 id="tituloConstruccion">En construcción...</h2>
        </div>
    </div>
</div>

    <script src="../js/bloka.js?v=20261013-10" defer></script>
</body>

</html>
