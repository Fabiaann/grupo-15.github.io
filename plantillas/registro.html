<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../estilos/estilos.css">
</head>

<body>



    <form class="contenedor-login formulario">
        <div class="login-header"> <img class="logo" src="../img/Logo.jpg"></img></div>
        <div class="bienvenido-login">
            <h1>Bienvenidos </h1>
        </div>


        <div class="contenedor-input-label">
            <div class="campo-formulario">
                <label  requiered>Nombre y Apellido</label>
                <p>(Nombre completo)</p>
       
            </div>
            <div >
            <input placeholder="ej: Jose Garcia"  for="nombre" >
            <small class="error-msg" class="error-nombre" ></small>
            </div>
        </div>


        <div class="contenedor-input-label">
            <div class="campo-formulario">
                <label for="nickName">NickName</label>
                <p>(Opcional)</p>
            </div>
            <input placeholder="ej: Jose Garcia">
        </div>
        <div class="contenedor-input-label">
            <div class="campo-formulario">
                <label for="edad" requiered>Edad</label>
                <p>(Debes ser mayor de 12)</p>
            </div>
            <input type="date" placeholder="ej: Jose Garcia" required>
        </div>
        <div class="contenedor-input-label">
            <div class="campo-formulario">
                <label for="mail" requiered>Mail</label>
                <p>(Nombre completo)</p>
            </div>
            <input type="email" placeholder="ej: Jose Garcia" required>
        </div>
        <div class="contenedor-input-label">
            <div class="campo-formulario">
                <label for="contraseña" requiered>Contraseña</label>
                <p>(La longitud debe ser mayor a 8 caracteres.)</p>
            </div>
            <input type="password" placeholder="********" required>
        </div>
        <div class="contenedor-input-label">
            <div class="campo-formulario">
                <label for="contraseña">Contraseña</label>
                <p>(Repite la Constraseña)</p>
            </div>
            <input type="password" placeholder="********" required>
        </div>






        <div class="reCaptcha-enviar">
            <label class="reCaptcha">
                <div class="reCaptcha-contenido">
                    <input type="checkbox" id="mi-checkbox">
                    <div class="reCaptcha-boton"></div>
                    <span class="reCaptcha-texto">No soy un robot</span>
                </div>


                <div class="recaptcha-logo-container">
                    <img src="../svg/recaptcha.svg" alt="reCaptcha-logo" class="recaptcha-logo">
                </div>
            </label>
            <button class="boton-form" type="submit" >Enviar</button>
            
        </div>

    <div class="loader-overlay">
   
    <div class="pista-loader">
        <div class="progreso-pista"></div>
        <div class="auto-loader">
            <img src="../svg/auto.svg" alt="Auto">
        </div>
    
        <img src="../svg/bandera.svg" alt="Bandera" class="bandera-loader">
    </div>
    
    <p class="loader-text">Espera a cruzar la meta...</p>
  
</div>
        <div class="inicio-redes">
            <p class="p-o">o</p>

            <div class="iniciar-session-app google">
                <div class="app-logo-container">
                    <img src="../svg/facebook.svg" alt="facebook-logo" class="facebook-logo">
                </div>
                <p> Continuar con Facebook</p>
            </div>


            <div class="iniciar-session-app google">
                <div class="app-logo-container">
                    <img src="../svg/google.svg" alt="google" class="google-logo">
                </div>
                <p> Continuar con Google</p>
            </div>

        </div>
         <div class="cambiar-modo"> 
            <p>¿Ya tienes cuenta?</p>
            <a href="../plantillas/login.html">Inicia sesion</a>

        </div>


    </form>


    <script src="../js/login.js"></script>
</body>

</html>
