<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro | JuegosOnline</title>
  <link rel="icon" type="image/png" href="../assets/logo-juegos-online.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=20260927">
  <link rel="stylesheet" href="../css/footer.css?v=20260927">
  <link rel="stylesheet" href="../css/header.css?v=20260928">
  <link rel="stylesheet" href="../css/carrusel.css">
</head>
<body class="auth-page">

<main >

 <form class="contenedor-login formulario">
    <div class="login-header"> 
        <img class="logo" src="../img/Logo.jpg">
    </div>
    
    <div class="bienvenido-login">
        <h1>Bienvenidos</h1>
    </div>

    <div class="contenedor-input-label">
        <div class="campo-formulario">
            <label required>Nombre y Apellido</label>
            <p>(Nombre completo)</p>
        </div>
        <div>
            <input placeholder="ej: Jose Garcia">
            <small class="error-msg error-nombre" id="error-nombre"></small>
        </div>
    </div>

    <div class="contenedor-input-label">
        <div class="campo-formulario">
            <label for="nickName">NickName</label>
            <p>(Opcional)</p>
        </div>
        <input placeholder="ej: Jose Garcia">
    </div>

    <div class="contenedor-input-label">
        <div class="campo-formulario">
            <label for="edad" required>Edad</label>
            <p>(Debes ser mayor de 12)</p>
        </div>
        <input type="date" required>
    </div>

    <div class="contenedor-input-label">
        <div class="campo-formulario">
            <label for="mail" required>Mail</label>
            <p>(Correo electrónico)</p>
        </div>
        <div>
            <!-- ID agregado para que el JS lo reconozca -->
            <input type="email" id="mail" placeholder="ej: correo@mail.com" required>
            <small class="error-msg" id="error-mail"></small>
        </div>
    </div>

    <div class="contenedor-input-label">
        <div class="campo-formulario">
            <label for="password" required>Contraseña</label>
            <p>(La longitud debe ser mayor a 8 caracteres.)</p>
        </div>
        <!-- ID agregado para que el JS lo reconozca -->
        <input type="password" id="password" placeholder="********" required>
        <small class="error-msg" id="error-password"></small>
    </div>

    <div class="contenedor-input-label">
        <div class="campo-formulario">
            <label for="password-repeat">Contraseña</label>
            <p>(Repite la Contraseña)</p>
        </div>
        <input type="password" placeholder="********" required>
    </div>

    <div class="reCaptcha-enviar">
        <label class="reCaptcha">
            <div class="reCaptcha-contenido">
                <input type="checkbox" id="mi-checkbox">
                <div class="reCaptcha-boton"></div>
                <span class="reCaptcha-texto">No soy un robot</span>
            </div>

            <div class="recaptcha-logo-container">
                <img src="../svg/recaptcha.svg" alt="reCaptcha-logo" class="recaptcha-logo">
            </div>
        </label>
        <button class="boton-form" type="submit">Enviar</button>
    </div>

    <div class="inicio-redes">
        <p class="p-o">o</p>

        <div class="iniciar-session-app google">
            <div class="app-logo-container">
                <img src="../svg/facebook.svg" alt="facebook-logo" class="facebook-logo">
            </div>
            <p>Continuar con Facebook</p>
        </div>

        <div class="iniciar-session-app google">
            <div class="app-logo-container">
                <img src="../svg/google.svg" alt="google" class="google-logo">
            </div>
            <p>Continuar con Google</p>
        </div>
    </div>

    <div class="cambiar-modo"> 
        <p>¿Ya tienes cuenta?</p>
        <a href="../pages/login.html">Inicia sesion</a>
    </div>
</form>
</main>

<script src="../js/login.js"></script>
</body>
</html>
