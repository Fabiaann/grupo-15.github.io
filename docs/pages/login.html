<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar | JuegosOnline</title>
  <link rel="icon" type="image/png" href="../assets/logo-juegos-online.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=20260927">
  <link rel="stylesheet" href="../css/footer.css?v=20260927">
  <link rel="stylesheet" href="../css/header.css?v=20260928">
  <link rel="stylesheet" href="../css/auth.css?v=20260927">
  <link rel="stylesheet" href="../css/carrusel.css">
</head>
<body class="auth-page">

<main >





<form class="contenedor-login formulario">

    <div class="login-header">
        <img class="logo" src="../img/Logo.jpg">
    </div>

    <div class="bienvenido-login">
        <h1>Hola de nuevo</h1>
    </div>


    <div class="contenedor-input-label">

        <div class="campo-formulario">
            <label requiered>Mail</label>
            <p>(Mail registrado)</p>
        </div>

        <div>
            <input id="mail" placeholder="ej: Jose Garcia" for="Mail" type="email">
            <small class="error-msg error-mail" id="error-mail"></small>
        </div>

    </div>


    <div class="contenedor-input-label">

        <div class="campo-formulario">
            <label for="nickName">Contraseña</label>
            <p>(No debe ser menor a 8 caracteres)</p>
        </div>

        <input id="password" placeholder="********" type="password">

        <small class="error-msg" id="error-password"></small>

    </div>



    <div class="reCaptcha-enviar">

        <label class="reCaptcha">

            <div class="reCaptcha-contenido">

                <input type="checkbox" id="mi-checkbox">

                <div class="reCaptcha-boton"></div>

                <span class="reCaptcha-texto">
                    No soy un robot
                </span>

            </div>


            <div class="recaptcha-logo-container">

                <img
                    src="../svg/recaptcha.svg"
                    alt="reCaptcha-logo"
                    class="recaptcha-logo"
                >

            </div>

        </label>


        <button class="boton-form" type="submit">
            Enviar
        </button>

    </div>






    <div class="inicio-redes">

        <p class="p-o">o</p>


        <div class="iniciar-session-app google">

            <div class="app-logo-container">

                <img
                    src="../svg/facebook.svg"
                    alt="facebook-logo"
                    class="facebook-logo"
                >

            </div>

            <p>
                Continuar con Facebook
            </p>

        </div>



        <div class="iniciar-session-app google">

            <div class="app-logo-container">

                <img
                    src="../svg/google.svg"
                    alt="google"
                    class="google-logo"
                >

            </div>

            <p>
                Continuar con Google
            </p>

        </div>

    </div>



    <div class="cambiar-modo">

        <p>¿No tienes cuenta?</p>

        <a href="../pages/registro.html">
            Registrate
        </a>

    </div>


</form>



    <script src="../js/login.js"></script>
</main>

<script src="../js/profile-menu.js?v=20260928"></script>
<script src="../js/auth.js?v=20260928"></script>
</body>
</html>
